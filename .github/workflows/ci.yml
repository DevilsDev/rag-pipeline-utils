name: CI

# Single CI workflow (replaces the former ci.yml + ci-enhanced.yml pair that
# ran the full suite twice on every push).
#
# The main branch ruleset requires the checks "Test & Lint (18)",
# "Test & Lint (20)" and "Test & Lint (22)". GitHub derives those names from
# the job name plus the single `node` matrix value, so keep the job name and
# do not add matrix keys or `include` entries to that job.

on:
  push:
    branches: [main, develop]
  # No base-branch filter: stacked PRs that target feature branches need CI too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  CI: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    # Includes packing and installing the tarball for the smoke test
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 20, 18]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      # jest-junit writes ./junit.xml (gitignored) for the artifact below.
      - name: Test
        run: npm test -- --ci --coverage --reporters=default --reporters=jest-junit

      # Installs the packed tarball into a clean project with production deps
      # only, so a dependency that is missing from package.json fails here.
      - name: Smoke test packed tarball
        run: npm run smoke:pack

      - name: Audit (non-blocking)
        run: npm audit --audit-level=moderate || echo "::warning::audit issues found"
        continue-on-error: true

      - name: License check (non-blocking)
        run: npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause' || echo "::warning::license issues"
        continue-on-error: true

      - name: Upload coverage
        if: always() && matrix.node == 20
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.node }}
          path: |
            coverage/
            junit.xml
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: Format & Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --prefer-offline

      # src/ is formatted by ESLint (checked in the Lint step above);
      # format:check covers everything else with Prettier.
      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --prefer-offline

      - name: Build package
        run: npm run build

      - name: Verify package
        run: npm run verify:pack

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7
