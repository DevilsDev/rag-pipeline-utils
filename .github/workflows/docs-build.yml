name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: CI=true npm ci --prefer-offline

      - name: Build documentation
        run: npm run docs:build

      # Lighthouse on pull requests: accessibility, best practices and SEO
      # must score at least 90 (performance warns below 90). The site is
      # served under /rag-pipeline-utils/ like GitHub Pages; reports are
      # uploaded as an artifact. See docs-site/lighthouserc.json.
      - name: Prepare site for Lighthouse
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p docs-site/.lighthouse-site
          cp -r docs-site/build docs-site/.lighthouse-site/rag-pipeline-utils

      - name: Lighthouse
        if: github.event_name == 'pull_request'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./docs-site/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs-site/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # A deploy that "succeeds" can still publish the wrong folder (see #94).
      # Fail the run unless the homepage and a docs page are served.
      - name: Check the deployed site
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" "docs/Introduction"; do
            code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE}${path}")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "${SITE}${path} -> HTTP ${code}"
            [ "$code" = "200" ] || exit 1
          done
