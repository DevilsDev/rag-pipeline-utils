name: Diagnostics (temporary)

on:
  pull_request:
    paths:
      - "benchmarks/diag-ollama.js"
      - ".github/workflows/diag-ollama.yml"

permissions:
  contents: read

jobs:
  ollama:
    name: Ollama latency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline
      - name: Start Ollama and pull all-minilm
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/pull -d '{"name":"all-minilm"}' | tail -1
          docker exec ollama ollama --version
      - run: node benchmarks/diag-ollama.js
