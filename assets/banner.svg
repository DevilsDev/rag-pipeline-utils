<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">rag-pipeline-utils</title>
  <desc id="desc">Composable RAG for Node.js: query, retrieve, rerank, generate, then an answer with citations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="58" font-weight="700" fill="#f8fafc">rag-pipeline-utils</text>
    <rect x="74" y="140" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="196" font-size="25" fill="#cbd5e1">Composable RAG for Node.js with grounded citations,</text>
    <text x="72" y="230" font-size="25" fill="#cbd5e1">evaluation, guardrails and a working CLI.</text>
  </g>


  <!-- compatibility chips -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="852" y="64" width="124" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#334155"/>
    <text x="914" y="85" fill="#cbd5e1">Node.js ≥ 22</text>
    <rect x="988" y="64" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#334155"/>
    <text x="1040" y="85" fill="#cbd5e1">ESM + CJS</text>
    <rect x="1104" y="64" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#334155"/>
    <text x="1156" y="85" fill="#cbd5e1">TypeScript</text>
  </g>

  <!-- pipeline -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">
    <g>
      <rect x="72" y="282" width="140" height="56" rx="12" fill="#111a33" stroke="#334155"/>
      <text x="142" y="316" fill="#e2e8f0">query</text>
    </g>
    <line x1="214" y1="310" x2="252" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="256" y="282" width="150" height="56" rx="12" fill="#111a33" stroke="#334155"/>
      <text x="331" y="316" fill="#e2e8f0">retrieve</text>
    </g>
    <line x1="408" y1="310" x2="446" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="450" y="282" width="140" height="56" rx="12" fill="#111a33" stroke="#334155"/>
      <text x="520" y="316" fill="#e2e8f0">rerank</text>
    </g>
    <line x1="592" y1="310" x2="630" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="634" y="282" width="150" height="56" rx="12" fill="#111a33" stroke="#334155"/>
      <text x="709" y="316" fill="#e2e8f0">generate</text>
    </g>
    <line x1="786" y1="310" x2="824" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="828" y="282" width="380" height="56" rx="12" fill="#0f2a3a" stroke="url(#accent)" stroke-width="2"/>
      <text x="1018" y="316" fill="#f8fafc">answer + citations [1][2]</text>
    </g>
  </g>

  <!-- guardrail bracket -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">
    <path d="M72 360 V370 H1208 V360" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <text x="640" y="398" text-anchor="middle">guardrails · evaluation in CI · token budgets · OpenAI · Anthropic · Cohere · Ollama · pgvector · Qdrant · offline</text>
  </g>
</svg>
