# Values for the rag-pipeline chart. The defaults run your image of
# examples/fastify-rag-demo; see deployment/README.md.

image:
  # Required: the image you built from examples/fastify-rag-demo.
  repository: your-registry.example.com/rag-fastify-demo
  tag: "" # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# Settings read by examples/fastify-rag-demo/server.js.
env:
  LOG_LEVEL: info
  OPENAI_MODEL: gpt-4o-mini
  QUERY_TIMEOUT_MS: "30000"
  RATE_LIMIT_MAX: "60"
  MIN_RELEVANCE_SCORE: "0.2"
  # "1" runs offline (local TF-IDF embeddings, no LLM, no API key needed).
  RAG_OFFLINE: "0"

# An existing Secret holding OPENAI_API_KEY, e.g.
#   kubectl create secret generic rag-pipeline-secrets \
#     --from-literal=OPENAI_API_KEY=sk-...
# Leave empty to run without an LLM key.
existingSecret: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: rag.example.com
  # The example's POST /query has no authentication of its own; put
  # authentication in front of it before enabling this.
  tlsSecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
