# Settings read by examples/fastify-rag-demo/server.js. The OpenAI key goes
# in a Secret (see deployment.yaml), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-pipeline-config
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
data:
  LOG_LEVEL: "info"
  OPENAI_MODEL: "gpt-4o-mini"
  QUERY_TIMEOUT_MS: "30000"
  RATE_LIMIT_MAX: "60"
  MIN_RELEVANCE_SCORE: "0.2"
  # "1" runs offline (local TF-IDF embeddings, no LLM, no API key needed).
  RAG_OFFLINE: "0"
