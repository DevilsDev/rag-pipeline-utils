# Runs your image of examples/fastify-rag-demo (see ../README.md for how to
# build and push it). No image is published by this project: replace
# `image` with your own.
#
# The OpenAI key is read from a Secret you create:
#   kubectl -n rag-pipeline create secret generic rag-pipeline-secrets \
#     --from-literal=OPENAI_API_KEY=sk-...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-pipeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        # The example image's user is named (`app`); Kubernetes needs a
        # numeric id to check runAsNonRoot.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: your-registry.example.com/rag-fastify-demo:3.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-pipeline-secrets
                  key: OPENAI_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: rag-pipeline-config
          # GET /health answers once the server is listening.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
