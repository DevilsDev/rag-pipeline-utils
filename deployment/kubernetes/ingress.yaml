# Optional: expose the service through your ingress controller. Replace the
# host and TLS secret; the example's POST /query has no authentication of
# its own, so put authentication in front of it before exposing it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-pipeline
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rag.example.com
      secretName: rag-pipeline-tls
  rules:
    - host: rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-pipeline
                port:
                  name: http
